<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 960px; background: #212121; font-family: 'Inter', sans-serif; }
  .wrap {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 100px;
  }
  .num { font-size: 24px; font-weight: 600; color: #4dd0e1; letter-spacing: 0.1em; margin-bottom: 18px; }
  .headline { font-size: 56px; font-weight: 800; color: #ffffff; line-height: 1.15; }
  .sub { font-size: 26px; font-weight: 400; color: #b0b0b0; margin-top: 20px; max-width: 980px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="num">__NUM__</div>
    <div class="headline">__HEADLINE__</div>
    <div class="sub">__SUB__</div>
  </div>
</body>
</html>
