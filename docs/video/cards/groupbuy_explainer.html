<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 960px; background: #212121; font-family: 'Inter', sans-serif; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 110px; }
  .headline { font-size: 46px; font-weight: 800; color: #ffffff; line-height: 1.2; text-align: center; margin-bottom: 10px; }
  .sub { font-size: 22px; font-weight: 400; color: #b0b0b0; text-align: center; margin-bottom: 36px; max-width: 900px; }

  .shot-frame {
    background: #ffffff; border-radius: 16px; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid #37474f; overflow: hidden; width: 620px;
  }
  .shot-frame img { display: block; width: 100%; }

  .callouts { display: flex; gap: 40px; margin-top: 40px; }
  .callout { flex: 1; text-align: center; max-width: 260px; }
  .callout .big { font-size: 40px; font-weight: 800; color: #4dd0e1; line-height: 1; margin-bottom: 8px; }
  .callout .lbl { font-size: 17px; font-weight: 600; color: #e0e0e0; line-height: 1.3; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="headline">__HEADLINE__</div>
    <div class="sub">__SUB__</div>
    <div class="shot-frame"><img src="__IMG_PATH__" /></div>
    <div class="callouts">
      <div class="callout"><div class="big">5</div><div class="lbl">nearby farmers<br>flagged by outbreak signal</div></div>
      <div class="callout"><div class="big">12%</div><div class="lbl">bulk discount<br>unlocked automatically</div></div>
      <div class="callout"><div class="big">&#8377;158<span style="font-size:22px">/kg</span></div><div class="lbl">vs &#8377;180/kg alone<br>same dealer, same day</div></div>
    </div>
  </div>
</body>
</html>
