<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 960px; background: #f6f5f0; font-family: 'Inter', sans-serif; }
  .wrap {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 100px;
  }
  .eyebrow {
    font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #0097A7; margin-bottom: 22px;
  }
  .title { font-size: 76px; font-weight: 800; color: #212121; line-height: 1.05; margin-bottom: 20px; }
  .subtitle { font-size: 30px; font-weight: 400; color: #595959; max-width: 980px; line-height: 1.4; }
  .badge-row { display: flex; gap: 14px; margin-top: 46px; }
  .badge {
    font-size: 17px; font-weight: 600; color: #0097A7; background: #e0f7fa;
    border-radius: 20px; padding: 10px 22px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">AI Builder Cup 2026 &middot; Google Cloud GenAI Hackathon</div>
    <div class="title">Kisan Mitra</div>
    <div class="subtitle">Photo in, cited diagnosis out &mdash; in your language.<br>A smallholder tomato crop advisory agent for the Kolar belt, Karnataka.</div>
    <div class="badge-row">
      <div class="badge">Real Gemini diagnosis</div>
      <div class="badge">Real function-calling</div>
      <div class="badge">Zero billing</div>
    </div>
  </div>
</body>
</html>
